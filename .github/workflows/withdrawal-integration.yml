name: Isolated Supabase withdrawal test
on:
  push:
    branches: [dev/web-readiness]
    paths:
      - '.github/workflows/withdrawal-integration.yml'
      - 'tests/supabase/**'
      - 'supabase/migrations/**'
      - 'lib/withdrawal-runner.mjs'
      - 'app/api/account/withdrawal/**'
      - 'package.json'
      - 'pnpm-workspace.yaml'
      - 'pnpm-lock.yaml'
permissions:
  contents: read
jobs:
  withdrawal:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: supabase/setup-cli@v1
        with:
          version: 3.4.0
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - run: pnpm install --frozen-lockfile --config.node-linker=hoisted
      - run: pnpm audit
      - run: pnpm exec eslint . --max-warnings 0
      - run: npm install --prefix "$RUNNER_TEMP/lt-browser" --ignore-scripts --no-audit playwright-core@1.57.0
      - run: bash tests/supabase/run.sh
        env:
          LT_BROWSER_MODULES: ${{ runner.temp }}/lt-browser/node_modules

